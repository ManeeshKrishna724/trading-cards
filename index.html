<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PnL Card</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<style>
  body { margin: 0; padding: 40px; background: #111; display: flex; flex-direction: column; justify-content: center; align-items: center; min-height: 100vh; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
  
  #card { 
    width: 420px; 
    height: 560px; 
    border-radius: 24px; 
    position: relative; 
    overflow: hidden; 
    box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.8);
    border: 1px solid rgba(255,255,255,0.08);
  }

  .bg-image { 
    position: absolute; top: 0; left: 0; width: 100%; height: 100%; 
    object-fit: cover; z-index: 0; background-color: #111; 
  }

  .glass-overlay { 
    position: absolute; top: 0; left: 0; width: 100%; height: 100%; 
    background: linear-gradient(to bottom, rgba(0,0,0,0.3) 0%, rgba(0,0,0,0.5) 40%, rgba(0,0,0,0.85) 100%); 
    z-index: 1; backdrop-filter: blur(0.5px);
  }

  .card-content { 
    position: relative; z-index: 2; padding: 32px; height: 100%; 
    box-sizing: border-box; display: flex; flex-direction: column; 
    justify-content: space-between; color: #fff; 
  }

  /* Header */
  .header { display: flex; justify-content: space-between; align-items: flex-start; }
  .asset-group { display: flex; align-items: center; gap: 12px; }
  .logo { 
    width: 36px; height: 36px; background: #fff; color: #000;
    border-radius: 10px; display: flex; align-items: center; justify-content: center; 
    font-size: 12px; font-weight: 900; letter-spacing: -0.5px;
  }
  .asset-info { display: flex; flex-direction: column; }
  .asset-name { font-size: 18px; font-weight: 800; letter-spacing: 0.5px; }
  .direction { font-size: 12px; font-weight: 700; letter-spacing: 1px; margin-top: 2px; opacity: 0.9; }
  
  .account-type { 
    font-size: 11px; font-weight: 600; color: rgba(255,255,255,0.6); 
    text-transform: uppercase; letter-spacing: 1px; 
    background: rgba(255,255,255,0.1); padding: 6px 12px; border-radius: 20px;
  }

  /* Subheader */
  .sub-header { display: flex; flex-direction: column; gap: 4px; margin-top: 16px; }
  .sub-tag { font-size: 12px; color: rgba(255,255,255,0.7); font-weight: 500; }

  /* PnL Section */
  .pnl-section { text-align: left; margin: 10px 0; }
  
  .pnl-row { display: flex; align-items: flex-end; gap: 10px; margin-bottom: 5px; }
  
  .pnl-value { 
    font-size: 60px; 
    font-weight: 900; 
    line-height: 1; 
    letter-spacing: -2px; 
  }
  
  .arrow { 
    font-size: 60px; 
    font-weight: 400; 
    line-height: 0.9; 
    margin-bottom: 12px; 
  }
  
  .pnl-amount { 
    font-size: 16px; font-weight: 500; margin-top: 5px; opacity: 0.7; 
    letter-spacing: 0.5px;
  }
  
  /* Colors */
  .text-green { color: #34D399; text-shadow: 0 0 40px rgba(52, 211, 153, 0.3); }
  .text-red { color: #F87171; text-shadow: 0 0 40px rgba(248, 113, 113, 0.3); }
  .text-neutral { color: #FFFFFF; text-shadow: 0 0 20px rgba(255, 255, 255, 0.2); }

  /* Chart */
  .chart-container { width: 100%; height: 60px; margin-bottom: 20px; opacity: 0.6; }
  .chart-line { fill: none; stroke-width: 3; stroke-linecap: round; stroke-linejoin: round; }

  /* Footer */
  .footer { border-top: 1px solid rgba(255,255,255,0.1); padding-top: 16px; display: flex; justify-content: center; }
  .footer-text { font-size: 16px; color: rgba(255,255,255,0.7); letter-spacing: 1px; font-weight: 600; }

  /* Download Button */
  #downloadBtn {
    margin-top: 30px; padding: 12px 24px; background: #fff; color: #000;
    border: none; border-radius: 8px; font-size: 14px; font-weight: 700; cursor: pointer;
  }
  #downloadBtn:hover { transform: scale(1.05); }
</style>
</head>
<body>

<div id="card">
  <!-- SMART FALLBACK: If random image fails, picks a random image between 1 and 20 -->
  <img class="bg-image" id="bgImage" src="" alt="Background" onerror="this.onerror=null; this.src='images/img' + (Math.floor(Math.random() * 20) + 1) + '.jpg';">
  <div class="glass-overlay"></div>
  
  <div class="card-content">
    <div>
      <div class="header">
        <div class="asset-group">
          <div class="logo" id="outAsset">NQ</div>
          <div class="asset-info">
            <div class="asset-name" id="outAssetName">NQ</div>
            <div class="direction" id="outDirection">LONG</div>
          </div>
        </div>
        <div class="account-type" id="outAccount">Prop Firm</div>
      </div>
      
      <div class="sub-header">
        <span class="sub-tag" id="outDate">Oct 24, 2023</span>
        <span class="sub-tag" id="outSession">NY Session</span>
        <span class="sub-tag" id="outTradeType">Continuation trade</span>
      </div>
    </div>

    <div class="pnl-section">
      <div class="pnl-row">
        <span class="pnl-value text-green" id="outPnlPercent">+2.4%</span>
        <span class="arrow text-green" id="outArrow">↗</span>
      </div>
      <div class="pnl-amount" id="outPnlAmount" style="color: #34D399;">+$306.48</div>
    </div>

    <div class="chart-container">
      <svg width="100%" height="100%" viewBox="0 0 350 60" preserveAspectRatio="none">
        <polyline class="chart-line" id="chartLine" points="" />
      </svg>
    </div>

    <div class="footer">
      <div class="footer-text" id="outName">Neo</div>
    </div>
  </div>
</div>

<button id="downloadBtn" onclick="downloadCard()"> Download PNG</button>

<script>
  function updateCard() {
    // Randomizer now looks for up to 100 images
    const randomNum = Math.floor(Math.random() * 100) + 1; 
    document.getElementById('bgImage').src = `images/img${randomNum}.jpg`;

    const pnlAmount = parseFloat(document.getElementById('inPnlAmount').value) || 0;
    
    let colorClass, arrow, sign;
    if (pnlAmount > 0) {
        colorClass = 'text-green'; arrow = '↗'; sign = '+';
    } else if (pnlAmount < 0) {
        colorClass = 'text-red'; arrow = '↘'; sign = '-';
    } else {
        colorClass = 'text-neutral'; arrow = '→'; sign = '';
    }

    document.getElementById('outAsset').innerText = document.getElementById('inAsset').value;
    document.getElementById('outAssetName').innerText = document.getElementById('inAsset').value;
    document.getElementById('outDirection').innerText = document.getElementById('inDirection').value;
    document.getElementById('outAccount').innerText = document.getElementById('inAccount').value;
    document.getElementById('outDate').innerText = document.getElementById('inDate').value;
    document.getElementById('outSession').innerText = document.getElementById('inSession').value;
    document.getElementById('outName').innerText = document.getElementById('inName').value; // Update footer name
    
    let rawTradeType = document.getElementById('inTradeType').value;
    document.getElementById('outTradeType').innerText = rawTradeType.toLowerCase().includes('trade') ? rawTradeType : rawTradeType + ' trade';
    
    const percentEl = document.getElementById('outPnlPercent');
    percentEl.className = `pnl-value ${colorClass}`;
    
    const percentVal = Math.abs(parseFloat(document.getElementById('inPnlPercent').value));
    percentEl.innerText = `${sign}${percentVal}%`;

    const arrowEl = document.getElementById('outArrow');
    arrowEl.className = `arrow ${colorClass}`;
    arrowEl.innerText = arrow;
    
    const amountEl = document.getElementById('outPnlAmount');
    let hexColor = colorClass === 'text-green' ? '#34D399' : (colorClass === 'text-red' ? '#F87171' : '#FFFFFF');
    amountEl.style.color = hexColor;
    amountEl.innerText = `${sign}$${Math.abs(pnlAmount).toFixed(2)}`;

    const chartLine = document.getElementById('chartLine');
    chartLine.setAttribute('stroke', hexColor);
    chartLine.setAttribute('filter', `drop-shadow(0 0 6px ${hexColor})`);
    
    let points = "0,50 ";
    let currentY = 50;
    for(let i=1; i<=8; i++) {
      let x = i * 43;
      let trend = pnlAmount > 0 ? -6 : (pnlAmount < 0 ? 6 : 0); 
      let random = (Math.random() - 0.5) * 15;
      currentY = Math.max(10, Math.min(50, currentY + trend + random));
      points += `${x},${currentY} `;
    }
    chartLine.setAttribute('points', points);
  }

  function downloadCard() {
    const card = document.getElementById('card');
    html2canvas(card, { scale: 2, backgroundColor: null, useCORS: true }).then(canvas => {
      const link = document.createElement('a');
      link.download = `PnL-${document.getElementById('inAsset').value}-${Date.now()}.png`;
      link.href = canvas.toDataURL('image/png');
      link.click();
    });
  }

  window.onload = function() {
    const params = new URLSearchParams(window.location.search);
    if(params.has('asset')) document.getElementById('inAsset').value = params.get('asset');
    if(params.has('pnlPercent')) document.getElementById('inPnlPercent').value = params.get('pnlPercent');
    if(params.has('pnlAmount')) document.getElementById('inPnlAmount').value = params.get('pnlAmount');
    if(params.has('date')) document.getElementById('inDate').value = params.get('date');
    if(params.has('direction')) document.getElementById('inDirection').value = params.get('direction');
    if(params.has('session')) document.getElementById('inSession').value = params.get('session');
    if(params.has('account')) document.getElementById('inAccount').value = params.get('account');
    if(params.has('tradeType')) document.getElementById('inTradeType').value = params.get('tradeType');
    if(params.has('name')) document.getElementById('inName').value = params.get('name'); // Read name from URL
    updateCard();
  };
</script>

<input type="hidden" id="inAsset" value="NQ">
<input type="hidden" id="inPnlPercent" value="2.4">
<input type="hidden" id="inPnlAmount" value="306.48">
<input type="hidden" id="inDate" value="Oct 24, 2023">
<input type="hidden" id="inDirection" value="LONG">
<input type="hidden" id="inSession" value="NY Session">
<input type="hidden" id="inAccount" value="Prop Firm">
<input type="hidden" id="inTradeType" value="Continuation">
<input type="hidden" id="inName" value="Neo">

</body>
</html>
