<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PnL Card</title>
<style>
  body { margin: 0; padding: 40px; background: #0a0a0a; display: flex; justify-content: center; align-items: center; min-height: 100vh; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
  #card { width: 400px; border-radius: 24px; position: relative; overflow: hidden; box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.8); }
  .bg-image { position: absolute; top: 0; left: 0; width: 100%; height: 100%; object-fit: cover; z-index: 0; }
  .glass-overlay { position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: linear-gradient(to top, rgba(0,0,0,0.9) 0%, rgba(0,0,0,0.5) 50%, rgba(0,0,0,0.2) 100%); z-index: 1; }
  .card-content { position: relative; z-index: 2; padding: 32px; color: #fff; }
  
  .header { display: flex; align-items: center; gap: 8px; margin-bottom: 16px; }
  .logo { width: 24px; height: 24px; background: #007AFF; border-radius: 6px; display: flex; align-items: center; justify-content: center; font-size: 10px; font-weight: 900; color: white; }
  .ticker { font-size: 14px; font-weight: 600; letter-spacing: 1px; color: rgba(255,255,255,0.8); }
  
  .pnl { font-size: 48px; font-weight: 800; margin: 0 0 16px 0; display: flex; align-items: center; gap: 12px; }
  .pnl.green { color: #34D399; }
  .pnl.red { color: #F87171; }
  .arrow { font-size: 32px; }
  
  .chart-container { width: 100%; height: 60px; margin: 16px 0; opacity: 0.7; }
  .chart-line { fill: none; stroke-width: 3; stroke-linecap: round; stroke-linejoin: round; }
  
  .stats { display: flex; justify-content: space-between; border-top: 1px solid rgba(255,255,255,0.15); padding-top: 16px; margin-top: 16px; }
  .stat-box { display: flex; flex-direction: column; gap: 4px; }
  .stat-label { font-size: 11px; color: rgba(255,255,255,0.5); text-transform: uppercase; letter-spacing: 0.5px; }
  .stat-value { font-size: 15px; font-weight: 600; color: #fff; }
</style>
</head>
<body>

<div id="card">
  <img class="bg-image" src="https://upload.wikimedia.org/wikipedia/commons/thumb/6/6d/Carl_von_Piloty_-_Murder_of_Caesar.jpg/800px-Carl_von_Piloty_-_Murder_of_Caesar.jpg" alt="Background">
  <div class="glass-overlay"></div>
  
  <div class="card-content">
    <div class="header">
      <div class="logo">MNQ</div>
      <div class="ticker" id="outTicker">MNQ LONG</div>
    </div>
    
    <div class="pnl green" id="outPnl">+$306.48 <span class="arrow">↗</span></div>
    
    <svg class="chart-container" viewBox="0 0 400 60">
      <polyline class="chart-line" id="chartLine" points="" />
    </svg>
    
    <div class="stats">
      <div class="stat-box">
        <span class="stat-label">Entry → Exit</span>
        <span class="stat-value" id="outPrices">29,805.02 → 29,871.00</span>
      </div>
      <div class="stat-box" style="text-align: right;">
        <span class="stat-label">Size • Risk/Reward</span>
        <span class="stat-value" id="outSize">3 contracts • 1:2.4</span>
      </div>
    </div>
  </div>
</div>

<script>
  function updateCard() {
    const pnl = parseFloat(document.getElementById('inPnl').value) || 0;
    const isWin = pnl >= 0;
    
    document.getElementById('outTicker').innerText = document.getElementById('inTicker').value;
    document.getElementById('outPrices').innerText = `${document.getElementById('inEntry').value} → ${document.getElementById('inExit').value}`;
    document.getElementById('outSize').innerText = `${document.getElementById('inSize').value} • ${document.getElementById('inRr').value}`;
    
    const pnlEl = document.getElementById('outPnl');
    pnlEl.className = `pnl ${isWin ? 'green' : 'red'}`;
    pnlEl.innerHTML = `${isWin ? '+' : ''}$${Math.abs(pnl).toFixed(2)} <span class="arrow">${isWin ? '↗' : '↘'}</span>`;
    
    const chartLine = document.getElementById('chartLine');
    chartLine.setAttribute('stroke', isWin ? '#34D399' : '#F87171');
    let points = "0,50 ";
    let currentY = 50;
    for(let i=1; i<=10; i++) {
      let x = i * 40;
      let trend = isWin ? -3 : 3;
      let random = (Math.random() - 0.5) * 15;
      currentY = Math.max(5, Math.min(55, currentY + trend + random));
      points += `${x},${currentY} `;
    }
    chartLine.setAttribute('points', points);
  }

  // AUTO-FILL FROM URL PARAMETERS
  window.onload = function() {
    const params = new URLSearchParams(window.location.search);
    if(params.has('ticker')) document.getElementById('inTicker').value = params.get('ticker');
    if(params.has('pnl')) document.getElementById('inPnl').value = params.get('pnl');
    if(params.has('entry')) document.getElementById('inEntry').value = params.get('entry');
    if(params.has('exit')) document.getElementById('inExit').value = params.get('exit');
    if(params.has('size')) document.getElementById('inSize').value = params.get('size');
    if(params.has('rr')) document.getElementById('inRr').value = params.get('rr');
    updateCard();
  };
</script>

<!-- Hidden inputs for the script to read -->
<input type="hidden" id="inTicker" value="MNQ LONG">
<input type="hidden" id="inPnl" value="306.48">
<input type="hidden" id="inEntry" value="29,805.02">
<input type="hidden" id="inExit" value="29,871.00">
<input type="hidden" id="inSize" value="3 contracts">
<input type="hidden" id="inRr" value="1:2.4">

</body>
</html>
